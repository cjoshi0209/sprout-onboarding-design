<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding 2: Preparation checklist</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
.cta:hover{background:#14502F}
.ghost:hover{background:#E6F2EA}
.back:hover{background:#E6F2EA}
.cta:focus-visible,.back:focus-visible,.ghost:focus-visible,input:focus-visible{outline:3px solid #1A4FB8;outline-offset:3px}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#FBF9F4;color:#12241A;font-family:'Plus Jakarta Sans','Noto Sans Devanagari',system-ui,sans-serif">

  <div style="position:absolute;left:0;right:0;top:0;bottom:84px;overflow-y:auto;box-sizing:border-box;padding:0 20px 24px;display:flex;flex-direction:column;gap:12px">

    <div style="display:flex;align-items:center;gap:6px;min-height:64px;margin-left:-8px">
      <a class="back" href="Onboarding1.dc.html" aria-label="Back" style="width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="#12241A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </a>
      <span style="font-size:19px;font-weight:800;letter-spacing:-0.01em">Sprout</span>
      <span style="margin-left:auto;font-size:14px;font-weight:600;color:#4A5B51">2 of 5</span>
    </div>

    <div role="img" aria-label="Step 2 of 5" style="display:flex;gap:6px">
      <i style="flex:1;height:4px;border-radius:2px;background:#1E6B46"></i><i style="flex:1;height:4px;border-radius:2px;background:#1E6B46"></i><i style="flex:1;height:4px;border-radius:2px;background:#D8E0DA"></i><i style="flex:1;height:4px;border-radius:2px;background:#D8E0DA"></i><i style="flex:1;height:4px;border-radius:2px;background:#D8E0DA"></i>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;margin-top:6px">
      <h1 style="margin:0;font-size:28px;line-height:1.2;font-weight:800;letter-spacing:-0.02em;white-space:nowrap">Get three things ready</h1>
      <p style="margin:0;font-size:16px;line-height:1.6;color:#4A5B51">Tick each one off as you find it.</p>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <sc-for list="{{items}}" as="item" hint-placeholder-count="3">
        <label style="display:flex;align-items:flex-start;gap:14px;box-sizing:border-box;min-height:64px;padding:12px 14px;border-radius:18px;cursor:pointer;border:1.5px solid {{item.border}};background:{{item.bg}}">
          <input type="checkbox" checked="{{item.checked}}" onChange="{{item.toggle}}" style="flex:none;width:24px;height:24px;margin:1px 0 0;accent-color:#1E6B46;cursor:pointer">
          <span style="display:flex;flex-direction:column;gap:2px">
            <strong style="font-size:16px;line-height:1.5">{{item.title}}</strong>
            <span style="font-size:14px;line-height:1.55;color:#4A5B51">{{item.sub}}</span>
          </span>
        </label>
      </sc-for>
    </div>

    <p style="margin:0;font-size:14px;font-weight:600;color:#4A5B51" aria-live="polite">{{countText}}</p>

    <sc-if value="{{reminderSet}}" hint-placeholder-val="{{ false }}">
      <div role="status" style="display:flex;gap:12px;align-items:flex-start;background:#E6F2EA;border-radius:16px;padding:14px 16px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex:none;margin-top:1px"><circle cx="12" cy="12" r="10" fill="#1E6B46"></circle><path d="M7.5 12.5l3 3 6-6.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <span style="font-size:15px;line-height:1.55">Reminder set for <strong>{{choiceLabel}}</strong>. We will send you this same checklist.</span>
      </div>
    </sc-if>

    <div style="display:flex;flex-direction:column;gap:10px">
      <a class="cta" href="Onboarding3.dc.html" style="display:flex;align-items:center;justify-content:center;min-height:56px;padding:14px 24px;border-radius:999px;background:#1E6B46;color:#FFFFFF;font-size:17px;font-weight:700;text-decoration:none">I’m ready</a>
      <button class="ghost" type="button" onClick="{{openSheet}}" style="min-height:56px;padding:14px 24px;border-radius:999px;border:2px solid #1E6B46;background:transparent;color:#1E6B46;font:700 17px/1.4 'Plus Jakarta Sans','Noto Sans Devanagari',system-ui,sans-serif;cursor:pointer">Remind me later</button>
    </div>
  </div>

  <sc-if value="{{sheetOpen}}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:0;right:0;top:0;bottom:84px;background:rgba(18,36,26,0.5);display:flex;flex-direction:column;justify-content:flex-end">
      <div role="dialog" aria-label="Choose a reminder time" style="background:#FFFFFF;border-radius:28px 28px 0 0;padding:12px 20px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 -8px 32px rgba(18,36,26,0.18)">
        <div style="align-self:center;width:44px;height:5px;border-radius:3px;background:#D8E0DA"></div>
        <h2 style="margin:4px 0 0;font-size:21px;line-height:1.3;font-weight:800;letter-spacing:-0.01em">When should we remind you?</h2>
        <div style="display:flex;flex-direction:column;gap:8px">
          <sc-for list="{{options}}" as="opt" hint-placeholder-count="3">
            <label style="display:flex;align-items:center;gap:14px;min-height:56px;box-sizing:border-box;padding:0 16px;border-radius:16px;cursor:pointer;border:1.5px solid {{opt.border}};background:{{opt.bg}};font-size:16px;font-weight:600">
              <input type="radio" name="when" checked="{{opt.checked}}" onChange="{{opt.pick}}" style="width:22px;height:22px;accent-color:#1E6B46;cursor:pointer">
              {{opt.label}}
            </label>
          </sc-for>
        </div>
        <button class="cta" type="button" onClick="{{setReminder}}" style="min-height:56px;padding:14px 24px;border-radius:999px;border:0;background:#1E6B46;color:#FFFFFF;font:700 17px/1.4 'Plus Jakarta Sans','Noto Sans Devanagari',system-ui,sans-serif;cursor:pointer">Set reminder</button>
        <button class="ghost" type="button" onClick="{{closeSheet}}" style="min-height:48px;border-radius:999px;border:0;background:transparent;color:#4A5B51;font:600 16px/1.4 'Plus Jakarta Sans','Noto Sans Devanagari',system-ui,sans-serif;cursor:pointer">Cancel</button>
      </div>
    </div>
  </sc-if>

  <div style="position:absolute;left:0;right:0;bottom:0">
    <dc-import name="Disclaimer" hint-size="100%,84px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { checked: [false, false, false], sheetOpen: false, choice: 0, reminderSet: false };
  }
  renderVals() {
    const s = this.state;
    const data = [
      ['PAN card', 'Your 10-character tax ID. The card or a photo of it is fine.'],
      ['Aadhaar and its linked mobile number', 'We will send a one-time code (OTP) to that number.'],
      ['Bank account details', 'Account number and IFSC, from a cheque book or your banking app.']
    ];
    const labels = ['in 1 hour', 'tonight at 8 pm', 'tomorrow at 10 am'];
    const items = data.map((d, i) => ({
      title: d[0], sub: d[1], checked: s.checked[i],
      bg: s.checked[i] ? '#E6F2EA' : '#FFFFFF',
      border: s.checked[i] ? '#1E6B46' : '#D8E0DA',
      toggle: () => { const c = s.checked.slice(); c[i] = !c[i]; this.setState({ checked: c }); }
    }));
    const options = labels.map((l, i) => ({
      label: l.charAt(0).toUpperCase() + l.slice(1), checked: s.choice === i,
      bg: s.choice === i ? '#E6F2EA' : '#FFFFFF',
      border: s.choice === i ? '#1E6B46' : '#D8E0DA',
      pick: () => this.setState({ choice: i })
    }));
    const n = s.checked.filter(Boolean).length;
    return {
      items, options,
      countText: n + ' of 3 ready',
      sheetOpen: s.sheetOpen,
      reminderSet: s.reminderSet,
      choiceLabel: labels[s.choice],
      openSheet: () => this.setState({ sheetOpen: true }),
      closeSheet: () => this.setState({ sheetOpen: false }),
      setReminder: () => this.setState({ sheetOpen: false, reminderSet: true })
    };
  }
}
</script>
</body>
</html>
