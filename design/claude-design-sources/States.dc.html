<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Screen 4 states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:2230px;height:1000px;box-sizing:border-box;padding:48px 60px;background:#EEF2EE;color:#12241A;font-family:'Plus Jakarta Sans','Noto Sans Devanagari',system-ui,sans-serif;display:flex;flex-direction:column;gap:20px">
  <p style="margin:0;font-size:17px;line-height:1.6;color:#4A5B51;max-width:1100px">Verification always names its state, says what is happening, and says whether the user needs to do anything. The “in progress” state is on the journey row; the other five are here. Each one is the same component with a different state.</p>
  <div style="display:flex;gap:40px;align-items:flex-start">

    <div style="width:390px;display:flex;flex-direction:column;gap:10px">
      <span style="font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:#4A5B51">Loading</span>
      <div style="box-sizing:border-box;background:#FBF9F4;border:1px solid #D8E0DA;border-radius:32px;padding:24px 20px 28px"><dc-import name="VerifyState" state="loading" pad="0px" hint-size="100%,560px"></dc-import></div>
    </div>

    <div style="width:390px;display:flex;flex-direction:column;gap:10px">
      <span style="font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:#4A5B51">Taking longer</span>
      <div style="box-sizing:border-box;background:#FBF9F4;border:1px solid #D8E0DA;border-radius:32px;padding:24px 20px 28px"><dc-import name="VerifyState" state="slow" pad="0px" hint-size="100%,760px"></dc-import></div>
    </div>

    <div style="width:390px;display:flex;flex-direction:column;gap:10px">
      <span style="font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:#4A5B51">Error</span>
      <div style="box-sizing:border-box;background:#FBF9F4;border:1px solid #D8E0DA;border-radius:32px;padding:24px 20px 28px"><dc-import name="VerifyState" state="error" pad="0px" hint-size="100%,640px"></dc-import></div>
    </div>

    <div style="width:390px;display:flex;flex-direction:column;gap:10px">
      <span style="font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:#4A5B51">Empty</span>
      <div style="box-sizing:border-box;background:#FBF9F4;border:1px solid #D8E0DA;border-radius:32px;padding:24px 20px 28px"><dc-import name="VerifyState" state="empty" pad="0px" hint-size="100%,480px"></dc-import></div>
    </div>

    <div style="width:390px;display:flex;flex-direction:column;gap:10px">
      <span style="font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:#4A5B51">Verified</span>
      <div style="box-sizing:border-box;background:#FBF9F4;border:1px solid #D8E0DA;border-radius:32px;padding:24px 20px 28px"><dc-import name="VerifyState" state="verified" pad="0px" hint-size="100%,480px"></dc-import></div>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2230,"height":1000}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
